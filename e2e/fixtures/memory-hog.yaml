apiVersion: v1
kind: Pod
metadata: { name: hog }
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  containers:
    - name: main
      image: busybox:1.37
      # dd holds a 100M buffer in memory, five times the limit.
      command: ["dd", "if=/dev/zero", "of=/dev/null", "bs=100M", "count=1"]
      resources:
        limits: { memory: 20Mi }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VP_GIT_HOOKS: "0"

jobs:
  checks:
    name: Checks on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      # The examples type-check against dist, so the build comes first.
      - run: vp pack
      - run: vp check
      - run: vp test

  clusters:
    name: Contract tests and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - uses: jdx/mise-action@v3
      - run: vp pack
      - run: pnpm run e2e:all
      - run: pnpm run e2e:tarball
